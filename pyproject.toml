[project]
name = "taa"
version = "0.1.0"
description = "FBS x MetaTrader 5 automated trading platform (engine, risk controls, backtesting, PWA dashboard)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["app/storage/migrations/versions", "frontend", ".railway"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit-style security rules
    "SIM",           # simplifications
    "RUF",           # ruff-specific
    "DTZ",           # timezone-aware datetimes only
    "PT",            # pytest style
    "T20",           # no print() in library code
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # unicode look-alikes in docs strings (×, →)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "DTZ001", "T20", "PT011", "PT018", "E501"]
"scripts/**" = ["T20"]
"app/cli/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.core.*", "app.risk.*", "app.execution.*", "app.security.*", "app.engine.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "mt5: requires a real MetaTrader 5 terminal (skipped by default; run with -m mt5)",
    "slow: long-running tests",
    "postgres: requires DATABASE_URL pointing to PostgreSQL",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/storage/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "frontend"]
