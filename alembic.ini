# Used for authoring migrations:  alembic -x url=sqlite:///data/dev.db revision --autogenerate -m "..."
# At runtime, migrations are applied via `python -m app.cli db upgrade`.
[alembic]
script_location = app/storage/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///data/dev-migrations.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
