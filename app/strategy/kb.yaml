- id: F20
  kind: finding
  stage: forest
  items: [A2, A8]
  says: "The edge of each side by market condition on M5 (by readings, not dates). BULL REGIME (D1 over a rising 50-day mean): M5 SELLS ARE AT A DISADVANTAGE - every sell tested lost there (fading a swept high -0.05 to -0.14 R, following a low's break -0.06 to -0.12); buys are at a smaller disadvantage, no edge alone (following a high's break -0.10 to +0.03, the reclaim of a swept low -0.03 to -0.08) - the same bull label gave buys +0.03 in one year and -0.09 in another, so a second condition (to find: O24) decides when bull-regime buys pay. ANY REGIME: a swept LOW is more often a fake and sweeps deeper than a swept HIGH (real 16-20 % vs 25-26 %; 90 % of fakes within 1.65-2.04 vs 1.21-1.31 M5 ATR; 1 ATR past: real 45 % vs 66-71 %) - so fading a break up already 1 ATR past a high is at a disadvantage, while a break down 1 ATR past a low still often comes back (the fade of a low keeps more of its edge). The 24-hour state (trend / sideways) changed the fake / real split little. BEAR and MIXED regimes: too few days in the design years to say (42 bear days); the replay months (mostly bear days) showed sells near 0 and buys -0.02 to -0.07 - information only. [LABEL: whole-period tables of a bare M5 trigger on every swing, a fixed 0.7 R target - a measure of that test, not a verdict on a method or a market condition (L18); the journal judges.]"
