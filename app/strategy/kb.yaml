- id: P16
  kind: principle
  stage: stop
  items: [C4]
  says: "The stop sits beyond the structure that proves the trade wrong AND past every liquidate zone (swings, equal lows / highs, round numbers, yesterday's high / low, swept wicks) - the first stop and every trailed stop."
  source: "owner 2026-10-19 / 10-23"

- id: P17
  kind: principle
  stage: picture
  items: [B1, B2, B3]
