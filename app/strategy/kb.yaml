- id: L19
  kind: lesson
  stage: target
  items: [C4, C5, B3]
  says: "Where the journal thinks opposite to the market (owner 25 Oct: 'find whether the error is our understanding or its translation into code'), the 12 trades of 7-9 Jul against the M1 candles: 2 won at their target; in 9 of the other 10 the price reached the AI's stop before its target (the mirrored trade would have won). Three kinds: (a) RIGHT SIDE, TARGET TOO FAR - 5 trades ran +0.67 to +1.26 R (wick) toward the target set at 0.8-1.9 R, then came back (07-07 07:15, 20:58; 07-09 13:26, 19:42, 21:10): the 'second pool when the first is under half the stop' target, my translation of 'fit both sides', against the owner's quick profit (P01, scalp first); (b) RIGHT SIDE, STOP SWEPT - 2 trades were stopped and price then reached the target (07-08 14:05 +12 R after, L16; 07-09 07:10 in 44 min); (c) WRONG SIDE - 2-3 trades never moved for us (07-08 18:44 +0.05 R best; 07-09 14:56 +0.41), the reclaim sells into M5 / M15 rhythm up (L17). The code did what it was told: break-even needs an M1 close at +1 R and the best closes were 0.96 / 0.93 R. So the error is in our understanding as written into the rules and the prompt (the target rule, W07's loose 'sweep'), not a bug."
  evidence: "research/2026-10-24-replay/audit_trades.py, out_audit_trades.txt; 12 trades is small - O26 runs forward in the journal"
  source: "owner 2026-10-25"

- id: L20
