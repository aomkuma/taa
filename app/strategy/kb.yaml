  says: "The edge inside a bull regime (D1 over a rising 50-day mean) by the H4 / H1 trend (the same mean-and-slope test on each frame). H4 AND H1 DOWN = the PULLBACK of the bull market: a sell is at its greatest disadvantage there (M5 -0.18 R, M1 -0.21), and buying a swept low that closes back has the best edge of every cell on M5 (+0.044 R, 60 % win; following a high's break +0.019, 60 %) - it is the moment to prepare a BUY at the pullback's bottom, not to sell. No H4 / H1 combination gives a bull-regime sell the edge in both methods (two single cells +0.002 and +0.053, the other method losing there). On M1 every bare trigger loses in every cell (-0.06 to -0.22: the stops are small, the spread is a larger part of the risk), the buys always above the sells of the same cell. [LABEL: whole-period tables of a bare M5 trigger on every swing, a fixed 0.7 R target - a measure of that test, not a verdict on a method or a market condition (L18); the journal judges.]"
  evidence: "2024 + 2025, bull days only (474); M5: reclaim 14,238 and follow 7,338 trades; M1: 67,111 and 37,853; stop 1.0 M5 / M1 ATR, target 0.7 R; candidates in the owner's windows on 82-83 % of bull days (M5 5.5 a day, M1 21.5)"
