- id: P24
  kind: principle
  stage: weapon
  items: [A8, C1, C6]
  says: "A setup has a life cycle: once the structure it was built on has run its course (the target reached, the move done), its idea is over - no re-entries or re-tests of the finished cycle (chasing). Wait for a new structure to form and judge its setup from scratch."
  evidence: "23 Oct: the owner's W sell 4,026.5 -> 4,010 played out at 21:10 and ran on to 3,975.6; my 'sell the re-test' candidate belonged to the finished cycle"
  source: "owner 2026-10-23 22:05 Thai; live/2026-10-23_night.md"

- id: P25
  kind: principle
  stage: method
  items: []
  says: "One loop for every idea, in order, so the knowledge stays in one place: (1) read this knowledge base first for the stage the idea touches (kb.py; what is already measured, failed or open); (2) state the question at ONE stage (forest, trend, animal, weapon, entry, stop, target, exit, size); (3) measure on the design data with the fixed split - side x the big regime (D1 vs its 50-day mean) x the owner's session windows - so every table compares with the others; (4) write the result here (F finding, X failed, S shadow, O open) the same day, AS THE EDGE BY MARKET CONDITION: in which conditions a method has the edge and in which it is at a disadvantage, with its R there (readings the system sees now), never 'it won in X / lost in Y' - the periods are only the evidence; when one condition label gives different results in two periods, the label is not the whole condition: look for what else differed; (5) only then propose the change to the system to the owner; (6) then rerun the journal. No chain of one-off scripts and verdicts in the chat."
  evidence: "25 Oct: four measurements in a row (sweep sides, reclaim 2025, by regime, follow the break) each split differently, none written here; W07 already said 'lost in 2023-25' before I re-measured it"
  source: "owner 2026-10-25: 'organise the system of thinking first, or the data you have is scattered, before doing other parts'; 'instead of saying when it lost or won, record which market condition it suits'; 'say in which market condition it has the edge or the disadvantage'"

- id: P27
  kind: principle
  stage: method
  items: []
  says: "All knowledge is useful; the market's condition decides which pieces lead the decision at this moment, and the rest is background - how many is not fixed (the owner's '5-10 of 100' was an example): as many as carry a measured edge in this condition, synthesised by me. The condition is read first (the D1 side, trend or range, the ATR's level and direction over the leg, the session, the phase), then the pieces with the measured edge in that condition are taken as the lead. 2025-04 .. 2026-04 ZigZag legs: with the ATR falling over the leg (M5-M30) a leg is undone 51-54 % of the time against 68-73 % with it flat - a trend: pullbacks ending 50-78.6 % went on 79-87 %; with the ATR high the pullbacks are shallower (median 69-82 % against 96-109 %) and a pullback past 61.8 % on H1 / H4 turned 81-88 %; with the ATR low or flat the legs are undone most - a range, the edges get swept. A pullback that takes out the leg's start (over 100 %) is the real turn; until then even 78.6-100 % went on 57-70 %."
  evidence: "research/2026-10-24-replay/out_retrace_depth.txt, out_retrace_atr.txt (MetaTrader 5's ZigZag 12/5/3, 2025-04-18 .. 2026-04-17)"
  source: "owner 2026-10-26: 'every piece of information is useful; the condition decides which to take as the lead - of 100 pieces of knowledge, a given trade may use 5-10 to decide'; '5-10 is an example - it may be more or fewer; synthesising what to do is your job'; 'ATR is needed with everything else: strong ATR fakes far, ATR falling while price keeps going may be a real trend'"
  since: 2026-10-26

- id: P26
  kind: principle
  stage: plan
  items: [A1, A2, A3, A7]
  says: "Before trading each day, the morning plan, written and summarised to the owner first: the market's condition (the D1 side, the H4 / H1 trend, volatility, the phase), yesterday's support / resistance and key levels (its high / low, swings, round numbers, zone lines and their bands, strong levels, volume nodes), the likely trend today, the opportunities, the side with the edge, the points where price may turn or go on (each as a scenario with its trigger, stop and take-profit point) and today's releases and windows. The trading day starts only after it."
  source: "owner 2026-10-25: 'before testing a trading day, start the day by looking at the market ... then summarise it to me; do this every time before trading; write it down as a rule'"
  since: 2026-10-25

