- id: L22
  kind: lesson
  stage: entry
  items: [B2, C3]
  says: "Never enter at the first moment price reaches the level: wait for the signal at the level (owner 2026-10-26). The code arms an order at its touch and fills it only after one: on M5 (owner: 'enter on M5 instead of M1'), read bar after bar until the structure is complete - a sweep past the level on volume and a close back, an M / W with its neckline broken, or for a stop order an M5 close through the level (a retest is not waited for: it missed 2 of 5 winners, L23); on M15-H1 a candlestick pattern at the level - a pin bar or an engulfing bar. It never chases past half the stop distance. 2026-07-08 (replay): the 07:25 sell filled on the touch of 4,105.84 while the M1 push still ran and was stopped at 4,112.48 (price went on to 4,126.69); the 13:15 sell at a top swept four times and closed back paid +1.14 R."
  evidence: "the M1 candles of 2026-07-08; research/2026-10-24-replay/day_2026-07-08.md"
  source: "owner 2026-10-26: 'wait for the chart to confirm'; 'candlestick patterns on 15 minutes to 1 hour; the price structure on M1 until it matches the pattern'; app/strategy/confirm.py"

- id: L23
  kind: lesson
  stage: forest
  items: [A1, A4]
  says: "Which order fits which market (owner 2026-10-26: 'sideways gives the fades many trades; a trend needs stop orders'). The 27 plan scenarios of 06-08 Jul, D1 down all three days: the sell stops (with D1) filled 5 of 5 and all reached their take-profit (+2.34 R at the touch, +1.53 R at an M5 close through; the retest filled only 3); the sell limits with D1 3 TP / 3 SL (+1.42 R); the counter-D1 orders 2 TP / 5 SL (-3.8 R). The confirmation signal changed no limit order's outcome, only its price. So the plan places no order against the D1 regime, and a stop order fills at an M5 close through its level."
  evidence: "research/2026-10-24-replay/out_regime_orders.txt (regime_orders.py on plans.jsonl and the M1 bars)"
  source: "owner 2026-10-26; L21; the journal days 06-08 Jul (3 days - to be judged on the days after)"

