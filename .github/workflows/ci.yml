name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install
        run: python -m pip install -r requirements/dev.txt
      - name: Lint
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
      - name: Types
        run: mypy app
      - name: Tests
        run: python -m pytest --cov=app --cov-report=term
      - name: Security (bandit)
        if: matrix.os == 'ubuntu-latest'
        run: bandit -q -r app -c pyproject.toml
      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest'
        run: pip-audit -r requirements/cloud.txt -r requirements/engine.txt

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taa
          POSTGRES_PASSWORD: taa
          POSTGRES_DB: taa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taa" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/dev.txt
      - name: Migrations + Postgres-marked tests
        env:
          DATABASE_URL: postgresql://taa:taa@localhost:5432/taa
        run: |
          python -m app.cli db upgrade --url "$DATABASE_URL"
          python -m pytest -m postgres -q

  frontend:
    if: hashFiles('frontend/package.json') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
