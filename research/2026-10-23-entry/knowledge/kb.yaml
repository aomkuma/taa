# The knowledge base, version 1 (2026-10-23) - the one source of truth for everything the owner and I have agreed,
# measured, tried and learned. Built from docs/OWNER_GOALS.md, docs/TRADER_ROUTINE.md, research/2026-10-22-zones/NOTES.md,
# research/2026-10-23-entry/{SPEC.md, DECISION_CHECKLIST.md, live/, replay/}, research/2026-10-18-moments/agents/CHECKLIST.md
# (rows 1-65) and journal/PLAN1_JOURNAL.md. KNOWLEDGE.md is generated from this file (kb.py render) - edit here only.
#
# behavior: a price behaviour (an animal) the observer counts - when it shows and what price did in the next hour
#   (observe.py, diary/BEHAVIORS.md); the readings behind O11-O22 come from behaviors.py.
# kind (the id prefix) and precedence when entries meet at a decision:
#   P principle  the owner's - always applies
#   R rule       in force: applied (held forward, or a frozen safety switch)
#   W weapon     the catalog: a strategy, its animal, its status and its numbers
#   S shadow     recorded and measured forward; shown at the decision, never applied until it holds >= 4 weeks
#   F finding    a measured fact; informs the weights and the reading
#   X failed     a method that lost; kept with its lesson, never retried as it was
#   L lesson     one case (a trade, a replay step, a correction); becomes a shadow / an acceptance case
#   O open       to study, or a draft the owner has not confirmed
# stage: where in the routine it is used - forest plan trend pressure clock animal weapon picture entry stop target
#   exit size after method observer
# items: DECISION_CHECKLIST.md items it belongs to (A1..E7)
# when: the readings it applies to - a map (all must hold) or a list of maps (any of them); absent = always.
#   Readings (kb.py features()): h1_vol (H1 ATR / its 20-day median), d1_atr20 (USD), h1_atr (USD),
#   session (asia / london / ny / none, the owner's windows in Thai time), phase (up / down / none, the last 3 D1
#   closes), yesterday (strong_up / strong_down / none), m15_rhythm h1_rhythm h4_rhythm d1_rhythm (up / down / none),
#   h1_big h4_big d1_big (up / down / none, 500 bars), release_min (minutes to the nearest US release, either way),
#   day_range_step (today's range in zone steps). Values: "> 1.1", ">= 60", "< 60", "<= 60", a word, or a list (any).

- id: P01
  kind: principle
  stage: method
  items: []
  says: "The goal is fixed, the method is flexible: >= +0.15 R a trade after the spread for every weapon, judged forward; about 3 trades a day, one a session (Asia, London, New York); consistent profit over many trades."
  evidence: "owner 2026-10-13 / 10-17"
  source: "docs/OWNER_GOALS.md; memory taa-goal-vs-method"

- id: P02
  kind: principle
  stage: weapon
  items: [A8]
  says: "No single rule decides direction. Several playbooks (follow the run, fade the false break, with the higher frames' flow); pick per situation or stand aside."
  source: "docs/OWNER_GOALS.md (2026-10-17)"

- id: P03
  kind: principle
  stage: entry
  items: [C1, C2, C3, C4]
  says: "One trade = all the evidence, weighted: zone plan, structure and its clarity, trend and phase, momentum at the level, entry precision, volatility, timing, volume, D1 context. Never one or a few parameters. Weights from the data, the owner's order as the prior (C1 > C2 > ... > C9)."
  source: "docs/OWNER_GOALS.md; SPEC.md section 3 (owner 2026-10-23)"

- id: P04
  kind: principle
  stage: entry
  items: [C3, C4, B1]
  says: "The entry decides - three conditions before any exit or filter is tuned: (1) a precise entry where the turn or run starts, the stop beyond the structure and outside every liquidation pool; (2) a clear enough structure on the entry frame, agreeing with the one above; (3) trend and momentum known - a turn against a strong run needs the run spent."
  evidence: "B2 entered 1.7-1.8 pattern heights past the extreme; median best after entry 0.4-0.6 R (F04)"
  source: "docs/OWNER_GOALS.md (owner, written 2026-10-23)"

- id: P05
  kind: principle
  stage: plan
  items: [A2]
  says: "Gold runs in zones of about 70-90 USD: step = D1 ATR(20) recomputed daily, anchored at the base a strong D1 move left (a body >= 1.5 ATR re-anchors), half lines between. A line is a band (+-0.15 step). The zone is the plan (where price sits, the target, the room); the edge is the entry and its timing; reaching a line is not by itself a reason to trade."
  evidence: "the grid fits the owner's lines within 0.5-4.5 USD at the capture time (F28)"
  source: "research/2026-10-22-zones/NOTES.md; app/strategy/zone_grid.py"

- id: P06
  kind: principle
  stage: forest
  items: [A1, A3]
  says: "See far: read hundreds of bars (H4 about four months, D1 about a year) for the trend and for the strong levels price may reach next - they set the targets, the room and where a stop must not sit."
  source: "owner 2026-10-23; app/strategy/big_trend.py, strong_levels.py"

- id: P07
  kind: principle
  stage: forest
  items: [A4]
  says: "No fixed timeframe: every condition is a principle on frames named by their place to the entry frame E (E+1 agrees, trend frames, zone frame); thresholds in that frame's bars / ATR / steps. Gold intraday start: D1 = the side, M15-H1 = the trend, M1-M5 = entry / exit / stop. Look at every TF for which one has a rhythm now."
  source: "SPEC.md section 0; memory taa-owner-tf-framework; owner 2026-10-23"

- id: P08
  kind: principle
  stage: animal
  items: [A8]
  says: "The market is a forest, the strategies are weapons, the situations are animals and the clock says when each comes out. Recognise the animal first, then take the weapon measured for it - or step back. Each weapon is judged only on its own animals."
  source: "docs/OWNER_GOALS.md (owner 2026-10-23)"

- id: P09
  kind: principle
  stage: target
  items: [C1, C5, C6]
  says: "Scalp first: with the M15 rhythm and the big frames, entry on M1 / M5, the target >= 5 USD or the next swing, before the line's band; take the profit and leave; when the market grows unsure, wait."
  source: "owner 2026-10-17 / 10-23; memory user-gold-pip-usd"

- id: P10
  kind: principle
  stage: picture
  items: [B4]
  says: "At a zone, wait for price to consolidate, then trade; if price breaks straight through, wait until it comes back near the zone."
  evidence: "measured: the consolidation breaks THROUGH (F01)"
  source: "owner 2026-10-23; zone_wait.py"

- id: P11
  kind: principle
  stage: clock
  items: [A6]
  when: {session: none}
  says: "Trade in the owner's windows (Thai time): Asia 07-09, London 13-14 (+- a little), the New York open + 1-2 h. Outside them is the lowest priority unless the picture is really clean."
  source: "memory taa-owner-time-windows"

- id: P12
  kind: principle
  stage: after
  items: [D1, D2]
  says: "The market is always right: learn from what price did; the owner's views and mine are prompts to observe and measure, rules only if the market's record supports them."
  source: "memory taa-market-is-always-right"

- id: P13
  kind: principle
  stage: after
  items: [C8]
  says: "No look-back trades: a missed trade is a lesson, never a trade. Every reading is written before the outcome is known."
  source: "owner 2026-10-23; replay/2024-01-02.md (the withdrawn 09:15 scalp)"

- id: P14
  kind: principle
  stage: method
  items: []
  says: "Live in the present: setups are revised every 3-6 months; the latest data judges; older years are background. A setup that works only in some periods is normal - see which period we are in now."
  source: "docs/OWNER_GOALS.md"

- id: P15
  kind: principle
  stage: size
  items: [C7]
  says: "Size by the account's risk percent; the 0.01-lot minimum is recorded, never a veto. Costs are the tick spread only (slippage 0)."
  source: "memory taa-small-account-streak, taa-costs-spread-only"

- id: P16
  kind: principle
  stage: stop
  items: [C4]
  says: "The stop sits beyond the structure that proves the trade wrong AND outside every pool (swings, equal lows / highs, round numbers, yesterday's high / low, swept wicks) - the first stop and every trailed stop."
  source: "owner 2026-10-19 / 10-23"

- id: P17
  kind: principle
  stage: picture
  items: [B1, B2, B3]
  says: "An entry needs a chart pattern at the level on the entry frame (inverse H&S, W / M, a base, a sweep + higher low) and every entry frame agreeing; enter and exit on the same frame; no entries in steep moves; trade at support / resistance, never mid-price except a pullback; surrender if it does not run."
  source: "memory taa-entry-needs-chart-pattern, taa-signal-plus-context"

- id: P18
  kind: principle
  stage: picture
  items: [B3]
  says: "A reversal on any frame = a level + price action + volume + high volatility together."
  source: "owner 2026-10-22"

- id: P19
  kind: principle
  stage: weapon
  items: [A7]
  when: {yesterday: [strong_up, strong_down]}
  says: "After a strong one-way day the obvious trade is with the move: the re-test, then the sell (buy) with it. The market ran three days and we lost every day - that should not happen."
  source: "owner 2026-10-22; memory taa-learning-adds-tools"

- id: P20
  kind: principle
  stage: method
  items: [D2]
  says: "A loss never stops the work: record FAIL with its lesson, transform before discarding (the other side, a wider stop, a nearer target), and when a method repeats the same result change its details toward how a trader trades."
  source: "memory taa-never-stop-checklist, taa-transform-before-discard, taa-same-result-change-method"

- id: P21
  kind: principle
  stage: method
  items: []
  says: "No coin flip in the system: a result near 50 % means observe closer - split it by what was there (frames, place, the move before, session, volatility)."
  source: "memory taa-no-coin-flip-verdict"

- id: P22
  kind: principle
  stage: observer
  items: [E1, E2, E3, E4, E5, E6, E7]
  says: "Always observe, always remember: the readers at every look (never by eye), the market diary hourly, scenarios written before and scored after, every miss the owner sees turned into a checklist item + an acceptance case + a memory."
  source: "owner 2026-10-23; DECISION_CHECKLIST.md section E; observe.py"

- id: P23
  kind: principle
  stage: animal
  items: [A5]
  says: "When the market phase does not suit a weapon it trades less (its surest signals only), not never - except above the volatility band, where it stands aside (R01)."
  source: "memory taa-regime-fit-principle, taa-stand-aside-high-volatility"

- id: P24
  kind: principle
  stage: weapon
  items: [A8, C1, C6]
  says: "A setup has a life cycle: once the structure it was built on has run its course (the target reached, the move done), its idea is over - no re-entries or re-tests of the finished cycle (chasing). Wait for a new structure to form and judge its setup from scratch."
  evidence: "23 Oct: the owner's W sell 4,026.5 -> 4,010 played out at 21:10 and ran on to 3,975.6; my 'sell the re-test' candidate belonged to the finished cycle"
  source: "owner 2026-10-23 22:05 Thai; live/2026-10-23_night.md"

