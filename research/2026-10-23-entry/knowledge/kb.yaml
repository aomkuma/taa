# ---------------------------------------------------------------- findings
- id: F01
  kind: finding
  stage: picture
  items: [B4]
  says: "A consolidation at a zone line tends to break THROUGH it (+0.087, all four years); back the way price came after consolidating -0.089 (all four negative); the bounce at the arrival -0.028; a straight break then the return +0.046 (mixed by year)."
  source: "zone_wait.py, out_zone_wait.txt (M15 2023-09 .. 2026-10)"

- id: F02
  kind: finding
  stage: plan
  items: [A2]
  says: "H4 turns sit anywhere in the zone: about 20 % within +-0.10 step of a line, 40 % within +-0.20, median a quarter step; a band of about a third of a step catches about 70 %. The line alone is not an entry."
  source: "research/2026-10-22-zones/NOTES.md (364 turns, 2025-10 .. 2026-04)"

- id: F04
  kind: finding
  stage: entry
  items: [C3]
