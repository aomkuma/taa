# TAA non-secret configuration. Environment variables override the matching risk values.
# Unknown keys are rejected at startup (typos are errors, not silently ignored).
# Risk values are PERCENT of equity (0.5 = 0.5%). Hard ceilings: 2% per trade, 10% daily, 50% drawdown.

symbols:
  allowed: [EURUSD, GBPUSD, USDJPY, XAUUSD]
  reference_symbol: EURUSD          # liquid symbol used to verify broker server time
  clock_fallback_symbols: [BTCUSD, ETHUSD]   # 24/7 crypto: verifies server time on weekends
  overrides:
    XAUUSD:
      max_spread_points: 40         # measure on your account and adjust
      max_lot: 0.5
      daily_breaks_utc: ["21:00-22:05"]

timeframes:
  higher: H1                        # bias / regime
  entry: M15                        # setups
  refinement: null                  # optional, e.g. M5
  warmup_bars: 400
  candle_close_grace_seconds: 3
  stale_tick_seconds: 120
  max_gap_bars: 3

indicators:
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi_period: 14
  atr_period: 14
  adx_period: 14
  swing_k: 3
  sr_tolerance_atr: 0.5

regime:                             # PLAN §A7: ADX >= 20 trending, < 18 ranging; ATR percentile > 90 volatile
  trend_adx: 20
  range_adx: 18
  volatile_atr_percentile: 90
  low_atr_percentile: 25            # volatility state bands (ATR percentile over indicators.atr_percentile_lookback)
  high_atr_percentile: 75
  extreme_atr_percentile: 90

strategies:
  cooldown_bars: 4
  signal_expiry_bars: 1
  allow_single_indicator_signals: false
  items:
    - name: example_trend_pullback  # DEMONSTRATION ONLY - not production-proven
      enabled: true
      params: {}
    # Pattern-based setups (PLAN §A29, docs/STRATEGIES.md): demonstration only, unproven. They need the
    # evidence engine; enable one at a time and watch its shadow results before trusting it.
    - {name: setup_neckline_break, enabled: false}
    - {name: setup_pattern_breakout, enabled: false}
    - {name: setup_fib_pullback, enabled: false}
    - {name: setup_harmonic_prz, enabled: false}
    - {name: setup_elliott_wave, enabled: false}
    - {name: setup_smc_reversal, enabled: false}    # needs max_age_bars >= confirm_window for sweep/CHoCH
    - {name: setup_breakout, enabled: false}
    - {name: setup_candle_reversal, enabled: false}

risk:
  max_risk_per_trade_percent: 0.5
  max_open_positions: 3
  max_positions_per_symbol: 1
  max_total_open_risk_percent: 1.5
  max_daily_loss_percent: 2.0
  max_weekly_loss_percent: 4.0
  max_account_drawdown_percent: 10.0
  max_consecutive_losses: 4
  consecutive_loss_pause_hours: 24
  max_spread_points: 30
  max_spread_to_sl_ratio: 0.15
  max_slippage_points: 10
  min_risk_reward: 1.5
  max_lot: 1.0
  min_margin_level_percent: 500
  max_margin_utilization_percent: 30
  max_effective_leverage: 10
  require_take_profit: true
  correlation_groups:
    EUR_GBP: [EURUSD, GBPUSD]
  probation_trades: 20
  probation_multiplier: 0.25
  foreign_positions_policy: count   # count | halt

sessions:                           # entry windows; local times of `timezone` (DST-aware), days are local weekdays
  default:
    - days: [0, 1, 2, 3, 4]         # Monday..Friday
      start: "07:00"
      end: "20:00"
      timezone: UTC
  by_symbol: {}                     # e.g. US30: [{days: [0,1,2,3,4], start: "09:30", end: "16:00", timezone: America/New_York}]
  friday_cutoff_utc: "20:00"
  news_blackouts: []                # e.g. - {start_utc: 2026-10-02T12:15:00Z, end_utc: 2026-10-02T13:00:00Z, currencies: [USD], reason: NFP}

position_management:
  break_even_trigger_r: 1.0
  trailing_start_r: 1.5
  trailing_atr_multiple: 2.0
  time_stop_bars: null

backtest:
  initial_balance: 10000
  account_currency: USD
  commission_per_lot: 0             # FBS Standard: spread-only
  spread_model: bar
  slippage_model: fixed
  slippage_points: 1
  leverage: 100                     # simulated margin only; sizing is risk-based
  seed: 42

paper:                              # PAPER mode: simulated fills on live quotes, never a broker order
  initial_balance: null             # null: the real account's equity at the first PAPER start
  slippage_points: 1
  swap_enabled: true

execution:                          # broker orders: DEMO account only (Phase 12); LIVE stays disabled
  deviation_points: null            # null: risk.max_slippage_points
  max_send_attempts: 2              # one retry after a requote, if the signal is still valid
  reconcile_after_seconds: 30       # an UNKNOWN order not found by then is NOT_EXECUTED
  reconcile_window_hours: 24        # history searches are widened by this much (broker time quirks)
  realized_risk_tolerance: 0.2      # fill risk more than 20 % above plan: reduce or close
  excess_risk_policy: reduce
  unprotected_grace_seconds: 5      # a position without SL: re-attach within this, else close
  symbol_pause_minutes: 60          # after a "symbol restricted" retcode

advisory:                           # PLAN §A25-A27: ranking and alerts; never changes what the bot trades
  universe:
    include: ["*"]                  # MT5 group patterns (wildcards)
    exclude: []                     # e.g. ["*.m", "*_raw"]
    classes:                        # exotics and unclassified symbols are opt-in
      FOREX_MAJOR: true
      FOREX_MINOR: true
      FOREX_EXOTIC: false
      METAL: true
      INDEX: true
      ENERGY: true
      CRYPTO: true
      STOCK: true
      OTHER: false
    symbols: {}                     # per-symbol overrides, e.g. {USDZAR: true, AAPL: false}
    auto_top_n: 30
    monitored_cap: 60
    refresh_hours: 24
  sessions:
    overrides: {}                   # e.g. {XAUUSD: [LONDON, NEW_YORK]}; names: SYDNEY TOKYO LONDON NEW_YORK EUROPE_EQUITIES US_EQUITIES CRYPTO
  suitability:                      # hard gates G1-G6 (PLAN A25)
    sl_atr_multiple: 1.5            # typical SL = k x ATR(atr_timeframe) + median spread
    atr_timeframe: H1
    atr_period: 14
    margin_buffer: 2.0              # G3: margin x buffer for temporary margin hikes
    stops_level_max_fraction: 0.5   # G5: broker stop distance < this x typical SL
    min_candles: 200                # G6
    max_quote_age_seconds: 300      # G6, checked only while the symbol's market is open
  scoring:                          # soft scores S1-S9 (PLAN A25); Overall = S1 S2 S3 S8 S9, Now = all
    weights: {S1: 1.0, S2: 1.0, S3: 1.0, S4: 1.0, S5: 0.5, S6: 0.5, S7: 1.0, S8: 1.0, S9: 0.5}
    preferred_regimes: [TRENDING, RANGING]
    edge_min_trades: 30             # S8 stays neutral (50) with fewer shadow/replay outcomes
    edge_prior_trades: 20
    edge_full_scale_r: 0.5
    swap_max_fraction: 0.05         # S9 is 0 when a night's swap costs 5% of the typical stop
    correlation_bars: 500
    correlation_min_overlap: 100

engine:
  monitor_interval_seconds: 1.0
  health_port: 8765

sync:
  enabled: false                    # true once the Railway web service is paired

evidence:                           # technical evidence engine (PLAN §A29, docs/PATTERNS.md)
  default_enabled: true             # detectors not listed below follow this
  atr_period: 14
  zigzag_degrees:                   # reversal threshold in ATR multiples per pivot degree
    minor: 1.5
    intermediate: 3.0
    major: 6.0
  session_timezone: Europe/Athens   # trading-day boundary for daily/weekly levels (FBS server time)
  detectors: {}                     # e.g. fib.golden_zone: {enabled: true, params: {max_age_bars: 3}}
  confluence:                       # setup-strength points (docs/PATTERNS.md "Confluence score"); not a probability
    core_weight: 40                 # a fully passed strategy checklist
    conflict_penalty: 0.75          # family_weights / tier_weights: built-in defaults unless overridden here
